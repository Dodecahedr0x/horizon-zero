[package]
name = "combat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic Horizon Zero battle rules"

[lib]
name = "horizon_combat"
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde", "dep:serde_json"]
# Logs where settle_match spends compute; see src/profile.rs and the cu_benchmark test.
cu-profile = []

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

# On-chain hashing goes through the sol_sha256 syscall; software SHA-256 costs thousands of CU per call.
[target.'cfg(target_os = "solana")'.dependencies]
solana-sha256-hasher = "3.1"

[target.'cfg(not(target_os = "solana"))'.dependencies]
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
serde_json = "1"
