services:
  - type: web
    name: horizon-zero
    runtime: node
    plan: starter
    # Node 24 matches CI. An open engines range makes Render install Current (the failed
    # build used 26.12.1). corepack enable rewrites /usr/bin/pnpm, which is read-only on
    # the Node image. npx runs pnpm 10 from the npm cache.
    buildCommand: npx --yes pnpm@10 install --frozen-lockfile && npx --yes pnpm@10 --filter app build
    startCommand: node app/server.js
    envVars:
      - key: INDEXER_URL
        fromService:
          name: horizon-zero-indexer
          type: pserv
          property: hostport
      # Comma-separated browser origins allowed to read GET /assets.
      # Set this to the landing origin, for example https://horizon-zero-landing.onrender.com
      # /api does not send this header. Unset uses the local landing dev and preview origins.
      - key: ASSET_CORS_ORIGINS
        sync: false
      # The server reads the chain and builds the transactions the browser signs (app/chain/http.mjs),
      # so these are runtime variables and never reach the bundle. On Render the server exits at startup if any is unset.
      # The Solana cluster. See scripts/deploy.mjs.
      - key: RPC_URL
        sync: false
      # The ephemeral rollup serving the validator the program was built for (HZ_VALIDATOR).
      - key: ER_RPC_URL
        sync: false
      # An ephemeral queue: lock_army runs in the rollup (SDK DEFAULT_EPHEMERAL_QUEUE). It must be the
      # queue the program was built for (HZ_VRF_QUEUE in scripts/deploy.mjs), or lock_army fails with BadQueue.
      - key: ORACLE_QUEUE
        value: 5hBR571xnXppuCPveTrctfTU7tJLSN94nq7kv7FRK5Tc
  - type: web
    name: horizon-zero-landing
    runtime: static
    buildCommand: cd landing && npm ci && npm run build
    staticPublishPath: landing/dist
    # fromService host is the private-network hostname. Static sites are not on that
    # network, so the public game URL cannot be injected. Set VITE_WEB_ORIGIN to the
    # horizon-zero public origin, for example https://horizon-zero.onrender.com
    # Vite inlines it at build time. Asset URLs are ${VITE_WEB_ORIGIN}/assets/...
    envVars:
      - key: VITE_WEB_ORIGIN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
  - type: pserv
    name: horizon-zero-indexer
    runtime: rust
    plan: starter
    buildCommand: cargo build --release --locked --manifest-path indexer/Cargo.toml
    startCommand: ./indexer/target/release/horizon-indexer
    disk:
      name: horizon-zero-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/horizon.db
      # The same ephemeral rollup as ER_RPC_URL, not the Solana RPC.
      - key: SOLANA_RPC_URL
        sync: false
      - key: PROGRAM_ID
        sync: false
