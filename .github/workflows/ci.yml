name: ci

on:
  push:
  pull_request:

jobs:
  litesvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.1/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Combat and LiteSVM
        run: |
          cargo test -p combat
          cargo test -p horizon-zero
          cargo-build-sbf --manifest-path programs/mock-vrf/Cargo.toml
          cargo-build-sbf --manifest-path programs/horizon-zero/Cargo.toml -- --features inline-mock-vrf,inline-mock-magic
          cargo test -p horizon-litesvm-tests -- --test-threads=1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Wasm replay matches the golden vector
        run: |
          rustup target add wasm32-unknown-unknown
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack build --target nodejs --out-dir ../../app/src/combat-node crates/combat --features wasm
          wasm-pack build --target web --out-dir ../../app/src/combat-wasm crates/combat --features wasm
          pnpm install
          pnpm --filter app test
          pnpm --filter asset-studio test

  localnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.1/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            indexer -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # The scripts import app/src/codec.ts, which needs Node's default type stripping.
          node-version: 24
          cache: pnpm
      # The stack starts the indexer with `cargo run` in indexer/, on its own toolchain file. Built
      # here, it is ready at once instead of compiling inside the stack's wait.
      - name: Build the indexer
        working-directory: indexer
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          cargo build
      - name: Local MagicBlock stack, a VRF-seeded battle, a withdrawal and a fee claim
        run: |
          pnpm install
          npm install -g @magicblock-labs/ephemeral-validator@0.14.10
          pnpm localnet:check
