[package]
name = "mock-vrf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LiteSVM stand-in for MagicBlock VRF"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_vrf"

[features]
# Checked by the code Anchor's #[program] macro generates.
custom-heap = []
custom-panic = []
default = []
no-entrypoint = []

[dependencies]
solana-program = "3.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
